# /etc/nginx/sites-available/vrioscu.conf
# TLS certificates via certbot (see docs/DEPLOYMENT.md).

limit_req_zone $binary_remote_addr zone=vr_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vr_general:10m rate=20r/s;

upstream vrioscu_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP: redirect everything to HTTPS (except ACME challenges).
server {
    listen 80;
    listen [::]:80;
    server_name vrioscu.com www.vrioscu.com;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://vrioscu.com$request_uri; }
}

# Canonicalise www -> apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vrioscu.com;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/vrioscu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vrioscu.com/privkey.pem;
    return 301 https://vrioscu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vrioscu.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/vrioscu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vrioscu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vr_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 64k;      # metadata/forms; installer chunks have a scoped limit
    client_body_timeout 15s;
    client_header_timeout 15s;
    proxy_read_timeout 30s;

    # Private immutable installers; external requests receive 404. Match the
    # verified RELEASE_STORAGE_PATH, never the source checkout or staging folder.
    location ~ "^/_protected_installers/([0-9a-f]{32}[.]exe)$" {
        internal;
        alias /var/lib/vrioscu-releases/objects/$1;
        disable_symlinks on;
        sendfile on;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location ^~ /api/v1/admin/release-uploads {
        client_max_body_size 8m;
        client_body_timeout 180s;
        limit_req zone=vr_general burst=10 nodelay;
        include /etc/nginx/snippets/vrioscu-proxy.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 180s;
    }

    # Never serve dotfiles, databases, backups, source or env files.
    location ~ /\.                          { deny all; return 404; }
    location ~* \.(db|sqlite3?|db-wal|db-shm|gz|bak|env|py|sql|ini|log)$ { deny all; return 404; }

    # Static assets served directly by nginx (the app's headers don't apply here, so repeat them).
    location /static/ {
        alias /opt/vrioscu/app/app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location ~ ^/(login|register|contact)$ {
        limit_req zone=vr_auth burst=10 nodelay;
        include /etc/nginx/snippets/vrioscu-proxy.conf;
    }

    location / {
        limit_req zone=vr_general burst=40 nodelay;
        include /etc/nginx/snippets/vrioscu-proxy.conf;
    }
}
